name: Web CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No package-lock.json is committed yet, so npm's dependency cache
      # (which needs a lock file to key off) is intentionally left off here.
      # Once you run `npm install` locally and commit the generated
      # package-lock.json, you can add `cache: npm` back above for faster runs.
      - run: npm install

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

  # Actual hosting/deploy of the Next.js app is handled by Vercel's own
  # GitHub integration (auto-deploys on push to main once the repo is
  # imported into a Vercel project) — this job is CI verification only.
